name: MCP Integration Check
description: Check discovery, schemas, authorization metadata, protocol errors and explicit examples using the official MCP client
inputs:
  config:
    description: Path to a trusted operator-authored JSON configuration
    required: true
  report:
    description: JSON report output path
    default: mcp-integration-report.json
runs:
  using: composite
  steps:
    - name: Install checker and pinned optional client
      shell: bash
      env:
        CHECKER_ROOT: ${{ github.action_path }}/../..
      run: python -m pip install "${CHECKER_ROOT}[mcp-check]"
    - name: Check the configured integration
      shell: bash
      env:
        CHECK_CONFIG: ${{ inputs.config }}
        CHECK_REPORT: ${{ inputs.report }}
      run: agenda-mcp-check "$CHECK_CONFIG" --out "$CHECK_REPORT" --strict
