version: 2
updates:
  # Fleet Worker code (the 12 profile workers share this package)
  - package-ecosystem: "npm"
    directory: "/deploy/cloudflare-worker"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # Telemetry / maintenance scripts (pyproject.toml at the root)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
