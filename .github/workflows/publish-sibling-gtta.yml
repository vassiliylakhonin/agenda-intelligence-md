# Temporary one-use bridge for GTTA 1.8.0. Delete after verified publication.
#
# This repository holds the account-scoped PyPI token that previously
# published global-think-tank-analyst 1.6.0 and 1.7.0. The sibling repository
# has no usable token and its Trusted Publisher is not registered. This
# dispatch-only workflow checks out only the immutable sibling tag, verifies
# its exact identity, repeats its release gate, and refuses an existing PyPI
# version before uploading.

name: Publish sibling — global-think-tank-analyst

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Exact global-think-tank-analyst tag to publish"
        required: true
        default: "v1.8.0"
        type: string

permissions:
  contents: read

concurrency:
  group: publish-sibling-gtta-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish GTTA 1.8.0
    runs-on: ubuntu-latest
    steps:
      - name: Check out GTTA at the requested tag
        uses: actions/checkout@v7
        with:
          repository: vassiliylakhonin/global-think-tank-analyst
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install build and test dependencies
        run: python -m pip install ".[test,mcp]" build "twine==7.0.0"

      - name: Verify immutable source identity
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_SHA: "80b7d5a3d75006cd76ccda6c299419e6c9307bc1"
        run: |
          python - <<'PY'
          import os
          import pathlib
          import subprocess
          import sys
          import tomllib

          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          name = project["project"]["name"]
          version = project["project"]["version"]
          expected_version = os.environ["RELEASE_TAG"].removeprefix("v")
          sha = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True
          ).strip()
          if name != "global-think-tank-analyst":
              sys.exit(f"refusing unexpected project {name!r}")
          if version != expected_version:
              sys.exit(f"version mismatch: {version!r} != {expected_version!r}")
          if sha != os.environ["EXPECTED_SHA"]:
              sys.exit(f"source mismatch: {sha!r}")
          print(f"verified {name} {version} at {sha}")
          PY

      - name: Refuse an existing immutable PyPI version
        run: |
          python - <<'PY'
          import json
          import urllib.error
          import urllib.request

          url = "https://pypi.org/pypi/global-think-tank-analyst/1.8.0/json"
          try:
              with urllib.request.urlopen(url) as response:
                  payload = json.load(response)
          except urllib.error.HTTPError as exc:
              if exc.code == 404:
                  print("PyPI 1.8.0 is absent; upload may proceed")
              else:
                  raise
          else:
              files = payload.get("urls", [])
              raise SystemExit(
                  f"refusing to overwrite existing PyPI 1.8.0 ({len(files)} files)"
              )
          PY

      - name: Run tests
        run: python -m pytest -q

      - name: Run repository checks
        run: python scripts/check.py

      - name: Build distributions
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Smoke-test installed wheel
        run: python scripts/test_wheel_install.py

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          print-hash: true
