name: Publish to PyPI

on:
  workflow_dispatch:

# TODO: switch to PyPI Trusted Publishers (OIDC) when PyPI access is available.
# Setup: https://pypi.org/manage/project/agenda-intelligence-md/settings/publishing/
# → Add publisher: GitHub / vassiliylakhonin / agenda-intelligence-md / publish.yml
# After setup: remove the `password` line below and set `attestations: true`.

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: python3 -m pip install build twine

      - name: Clean build artifacts
        run: rm -rf dist build

      - name: Build package
        run: python3 -m build

      - name: Check package metadata
        run: python3 -m twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
          attestations: false
