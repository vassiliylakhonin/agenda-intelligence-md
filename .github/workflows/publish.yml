name: Publish to PyPI

on:
  workflow_dispatch:

# Publishes via PyPI Trusted Publishers (OIDC): no long-lived token, and the
# upload carries a PEP 740 attestation binding the artifact to this workflow.
# The publisher must be registered on PyPI first, at
# https://pypi.org/manage/project/agenda-intelligence-md/settings/publishing/
# as GitHub / vassiliylakhonin / agenda-intelligence-md / publish.yml (and again
# for release.yml). Without it the upload is rejected as an untrusted publisher.

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: python3 -m pip install build twine

      - name: Clean build artifacts
        run: rm -rf dist build

      - name: Build package
        run: python3 -m build

      - name: Check package metadata
        run: python3 -m twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          attestations: true
