name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python3 -m pip install --upgrade pip

      - name: Install package build tools
        run: python3 -m pip install build twine

      - name: Install package with dev extras
        run: pip install -e ".[dev]"

      - name: Ensure generated package artifacts are not tracked
        shell: bash
        run: |
          tracked_artifacts="$(git ls-files 'dist/*' 'build/*' '*.egg-info/*')"
          if [ -n "$tracked_artifacts" ]; then
            echo "Generated package artifacts must not be tracked:"
            echo "$tracked_artifacts"
            exit 1
          fi

      - name: Run linter (ruff)
        run: ruff check src/ scripts/ tests/

      - name: Run type checker (mypy)
        run: mypy src/agenda_intelligence

      - name: Compile Python files
        run: python3 -m compileall src scripts tests

      - name: Run unit tests
        run: python3 -m pytest --maxfail=1 --disable-warnings -q

      - name: Verify CLI commands
        run: |
          python3 -m agenda_intelligence.cli --help
          python3 -m agenda_intelligence.cli validate-manifest
          python3 -m agenda_intelligence.cli validate-brief examples/agenda-brief.json
          python3 -m agenda_intelligence.cli validate-evidence examples/source/evidence-pack.json
          python3 -m agenda_intelligence.cli memory-lint --format json
          python3 -m agenda_intelligence.cli memory-search sanctions
          python3 -m agenda_intelligence.cli memory-search-bench tests/fixtures/analysis_bank_retrieval/manifest.json --format json
          python3 -m agenda_intelligence.cli memory-applicability-bench tests/fixtures/analysis_bank_applicability/manifest.json --format json
          python3 -m agenda_intelligence.cli memo-quality-bench tests/fixtures/memo_quality --format json
          python3 -m agenda_intelligence.cli weekly-delta-bench tests/fixtures/weekly_delta --format json
          python3 -m agenda_intelligence.cli doctor --mcp-command "python3 -m agenda_intelligence.mcp_stdio" --strict

      - name: Validate source-backed evidence examples
        run: |
          for file in examples/source-backed/*.evidence.json; do
            python3 -m agenda_intelligence.cli validate-evidence "$file"
          done

      - name: Smoke-check docs commands
        run: |
          python3 -m agenda_intelligence.cli --help
          python3 -m agenda_intelligence.cli start technology-ai
          python3 -m agenda_intelligence.cli validate-brief examples/agenda-brief.json
          python3 -m agenda_intelligence.cli validate-evidence examples/source/evidence-pack.json
          python3 -m agenda_intelligence.cli source-plan technology-ai
          python3 -m agenda_intelligence.cli score examples/before-after/eu-ai-act.md
          python3 -m agenda_intelligence.cli memory-lint
          python3 -m agenda_intelligence.cli memory-search sanctions
          python3 -m agenda_intelligence.cli memory-search-bench tests/fixtures/analysis_bank_retrieval/manifest.json
          python3 -m agenda_intelligence.cli memory-applicability-bench tests/fixtures/analysis_bank_applicability/manifest.json
          python3 -m agenda_intelligence.cli memo-quality-bench tests/fixtures/memo_quality
          python3 -m agenda_intelligence.cli weekly-delta-bench tests/fixtures/weekly_delta
          python3 -m agenda_intelligence.cli doctor --mcp-command "python3 -m agenda_intelligence.mcp_stdio" --json --strict
          python3 scripts/smoke_mcp_config.py --command "python3 -m agenda_intelligence.cli"
          python3 scripts/smoke_mcp.py --command "python3 -m agenda_intelligence.mcp_stdio"

      - name: Validate public examples and docs commands
        run: |
          python3 scripts/validate.py
          python3 scripts/validate_public_examples.py

      - name: Build package artifacts
        run: python3 -m build

      - name: Check package metadata
        run: python3 -m twine check dist/*

      - name: Smoke-install built wheel
        shell: bash
        run: |
          python3 -m venv .wheel-smoke-venv
          .wheel-smoke-venv/bin/python -m pip install --upgrade pip
          .wheel-smoke-venv/bin/python -m pip install dist/*.whl
          .wheel-smoke-venv/bin/agenda-intelligence --version
          .wheel-smoke-venv/bin/agenda-intelligence validate-manifest

  typescript-client:
    name: TypeScript client
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The generated sources are the published package, so a schema change that
      # was not regenerated fails here rather than in a partner's build.
      - name: Check the client matches schemas/v1
        run: python3 scripts/generate_ts_client.py --check

      # Types alone do not prove the package loads: this caught ESM imports
      # missing their file extension, which tsc accepts and Node does not.
      - name: Compile and load
        working-directory: clients/typescript
        run: |
          npm install --no-audit --no-fund typescript@5.4.5
          ./node_modules/.bin/tsc -p tsconfig.json
          node --input-type=module -e "import('./dist/index.js').then(m => {
            if (typeof m.AgendaIntelligenceClient !== 'function') { throw new Error('client missing from the built package'); }
            if (typeof m.RateLimitError !== 'function') { throw new Error('RateLimitError missing from the built package'); }
            console.log('ok: built package loads and exports its client');
          })"

  worker:
    name: Cloudflare Worker tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: deploy/cloudflare-worker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Test the Worker
        run: npm test
