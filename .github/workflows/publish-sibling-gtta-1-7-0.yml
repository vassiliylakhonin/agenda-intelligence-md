# Temporary, single-use bridge for global-think-tank-analyst v1.7.0.
#
# This workflow is intentionally dispatch-only and hard-coded to one immutable
# sibling tag. It must be deleted after the PyPI version and clean install are
# verified. The retained decision record explains why the bridge exists.

name: Publish sibling GTTA v1.7.0

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-sibling-gtta-v1.7.0
  cancel-in-progress: false

jobs:
  publish:
    name: Build, verify, and publish GTTA v1.7.0
    runs-on: ubuntu-latest
    steps:
      - name: Check out the immutable GTTA release tag
        uses: actions/checkout@v6
        with:
          repository: vassiliylakhonin/global-think-tank-analyst
          ref: v1.7.0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install build and test dependencies
        run: python -m pip install ".[test,mcp,verification]" "twine==7.0.0"

      - name: Verify exact project and version
        run: |
          python - <<'PY'
          import pathlib
          import sys
          import tomllib

          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]
          expected = {"name": "global-think-tank-analyst", "version": "1.7.0"}
          actual = {key: project[key] for key in expected}
          if actual != expected:
              sys.exit(f"refusing to publish unexpected project: {actual!r}")
          print(f"verified: {actual}")
          PY

      - name: Run tests
        run: python -m pytest -q

      - name: Run repository checks
        run: python scripts/check.py

      - name: Build distributions
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Smoke-test installed wheel
        run: python scripts/test_wheel_install.py

      - name: Publish to PyPI with the existing account-scoped token
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          print-hash: true
