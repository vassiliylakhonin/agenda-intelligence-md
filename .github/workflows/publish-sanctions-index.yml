name: Publish gated sanctions snapshot

on:
  schedule:
    - cron: '5 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: existing-worker-fleet-production
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The Pages and Worker credentials remain separate. The existing CIS Worker
    # receives only the compact asset, through its normal signed Vizier gate.
    environment:
      name: agent-output-verification-production
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Require clean immutable main
        run: |
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          git switch -C main "$GITHUB_SHA"
      - name: Rebuild and gate every official source before minting a grant
        run: python -u scripts/publish_sanctions_index.py
      - name: Mint a short-lived grant for the existing CIS Worker
        working-directory: deploy/cloudflare-worker
        env:
          VIZIER_DELEGATION_SIGNING_KEY: ${{ secrets.VIZIER_DELEGATION_SIGNING_KEY }}
        run: node scripts/mint-deploy-grant.js --out "$RUNNER_TEMP/vizier-deploy-grant.jws" --env cis-secondary-sanctions
      - name: Rebuild, verify all gates, publish and verify exact canonical bytes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          CLOUDFLARE_WORKER_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VIZIER_API_KEY: ${{ secrets.VIZIER_API_KEY }}
          VIZIER_DEPLOY_GRANT_FILE: ${{ runner.temp }}/vizier-deploy-grant.jws
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Dedicated Pages publisher credential is missing.' >&2; exit 1; }
          python -u scripts/publish_sanctions_index.py --publish-prepared
      - name: Remove deployment grant
        if: always()
        run: rm -f "$RUNNER_TEMP/vizier-deploy-grant.jws"
