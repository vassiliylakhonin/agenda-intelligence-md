name: Post-release smoke

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: "Published package version to smoke-test, for example 0.5.5"
        required: true

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${{ github.event.workflow_run.head_branch }}"
            version="${version#v}"
          fi
          # Accept PEP 440 release and pre/post/dev releases, plus SemVer-style
          # pre-release/build segments via -/+. Bash =~ uses POSIX ERE, so plain
          # groups (no ?:). Examples: 1.0.0, 1.0.0rc1, 1.0.0a2, 1.0.0.post1,
          # 1.0.0.dev3, 1.0.0-rc.1.
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+|[-+][0-9A-Za-z.-]+)?(\.post[0-9]+)?(\.dev[0-9]+)?$ ]]; then
            echo "Unsupported version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install published package
        shell: bash
        run: |
          python -m venv .smoke-venv
          .smoke-venv/bin/python -m pip install --upgrade pip
          for attempt in 1 2 3 4 5; do
            if .smoke-venv/bin/python -m pip install "agenda-intelligence-md==${{ steps.version.outputs.version }}"; then
              exit 0
            fi
            echo "Package not visible on PyPI yet; retrying in 20 seconds..."
            sleep 20
          done
          exit 1

      - name: Verify package version
        run: |
          .smoke-venv/bin/agenda-intelligence --version
          test "$(.smoke-venv/bin/agenda-intelligence --version)" = "agenda-intelligence ${{ steps.version.outputs.version }}"

      - name: Verify packaged manifest
        run: |
          .smoke-venv/bin/agenda-intelligence manifest > /tmp/agenda-manifest.json
          .smoke-venv/bin/python - <<'PY'
          import json
          import os

          expected = os.environ["EXPECTED_VERSION"]
          data = json.load(open("/tmp/agenda-manifest.json"))
          assert data["version"] == expected, data["version"]
          PY
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}

      - name: Verify CLI validation and scoring
        run: |
          .smoke-venv/bin/agenda-intelligence validate-brief examples/agenda-brief.json
          .smoke-venv/bin/agenda-intelligence validate-evidence examples/source/evidence-pack.json
          .smoke-venv/bin/agenda-intelligence score examples/agenda-brief.json --evidence examples/source/evidence-pack.json
          .smoke-venv/bin/agenda-intelligence doctor --strict --mcp-command ".smoke-venv/bin/agenda-intelligence-mcp"

      - name: Verify grounding and Claim Verdict capabilities
        shell: bash
        run: |
          .smoke-venv/bin/agenda-intelligence grounded-check \
            examples/grounded-check/request.json --format json > /tmp/grounded-check.json
          .smoke-venv/bin/agenda-intelligence verify-claims \
            examples/claim-verification/request.json --strict --format json > /tmp/claim-verdict.json
          .smoke-venv/bin/python - <<'PY'
          import json

          grounded = json.load(open("/tmp/grounded-check.json"))
          verdict = json.load(open("/tmp/claim-verdict.json"))
          assert grounded["grounding_signal"] == "ungrounded", grounded
          assert verdict["results"][0]["verdict"] == "verified", verdict
          PY

      - name: Verify MCP stdio server
        shell: bash
        run: |
          .smoke-venv/bin/agenda-intelligence mcp-config
          .smoke-venv/bin/python scripts/smoke_mcp_config.py \
            --command ".smoke-venv/bin/agenda-intelligence"
          .smoke-venv/bin/python scripts/smoke_mcp.py \
            --command ".smoke-venv/bin/agenda-intelligence-mcp" \
            --expected-version "${{ steps.version.outputs.version }}"
          .smoke-venv/bin/python - <<'PY'
          from agenda_intelligence.mcp_stdio import TOOLS

          assert "grounded_check" in TOOLS
          assert "verify_claims" in TOOLS
          PY
