name: Publish TypeScript client to npm

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-typescript-client
  cancel-in-progress: false

jobs:
  publish:
    # Publish immutable release content, never a moving branch.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: clients/typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Verify release version and generated sources
        env:
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          if (pkg.name !== '@agenda-intelligence/client' ||
              'v' + pkg.version !== process.env.RELEASE_REF) {
            throw new Error('Package and immutable release tag must match');
          }
          JS
          python3 ../../scripts/generate_ts_client.py --check
      - name: Build and verify the actual package
        run: |
          npm install --ignore-scripts --no-save --package-lock=false --no-audit --no-fund typescript@5.4.5
          npm run build
          node --test test/*.test.mjs
          npm pack --dry-run
      - name: Publish the verified package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
