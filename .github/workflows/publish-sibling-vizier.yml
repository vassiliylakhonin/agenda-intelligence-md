# Temporary bridge: publish vizier-guard using this repository's account-scoped token.
#
# Why it is here, in the wrong repository on purpose.
#
# `PYPI_API_TOKEN` in this repository is account-scoped, not project-scoped: it
# was created at 2026-05-01T17:44:48Z, five minutes before this project's first
# upload at 17:49:52Z, and a project-scoped token cannot exist before its
# project does. So it can publish any project on the account.
#
# `vizier` cannot publish itself yet. It holds no PyPI secrets and PyPI web login
# is blocked pending 2FA recovery (pypi/support#12033). Its v0.3.0 release therefore
# built cleanly locally and in CI, but cannot authenticate at upload without a
# registered Trusted Publisher or token.
#
# GitHub secrets are write-only, so the token cannot be copied into the vizier
# repository without the maintainer re-entering it, and it cannot be re-issued
# without the web login. Running the upload here, where the secret already
# lives, is the established bridge pattern (same as commit 71d337e for global-think-tank-analyst).
#
# Dispatch-only, never automatic. It checks out the sibling at its tag, refuses to
# run if `pyproject.toml` names any other project, and repeats that repository's
# own release gates — version/tag match, tests, twine metadata check.
#
# To be deleted once the publish completes.

name: Publish sibling — vizier-guard

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of vizier to build and publish"
        required: true
        default: "v0.3.0"
        type: string

permissions:
  contents: read

concurrency:
  group: publish-sibling-vizier-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish vizier-guard
    runs-on: ubuntu-latest
    steps:
      - name: Check out vizier at the tag
        uses: actions/checkout@v4
        with:
          repository: vassiliylakhonin/vizier
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "packages/python-sdk[test,pydantic,httpx]" build twine

      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python -c "import os, pathlib, tomllib; expected = os.environ['RELEASE_TAG'].removeprefix('v'); actual = tomllib.loads(pathlib.Path('packages/python-sdk/pyproject.toml').read_text())['project']['version']; assert actual == expected, f'{actual} != {expected}'"

      - name: Confirm the project name is vizier-guard
        run: |
          python - <<'PY'
          import pathlib, tomllib, sys
          name = tomllib.loads(pathlib.Path("packages/python-sdk/pyproject.toml").read_text())["project"]["name"]
          if name != "vizier-guard":
              sys.exit(f"refusing to publish unexpected project {name!r}")
          print(f"project: {name}")
          PY

      - name: Run tests
        run: |
          cd packages/python-sdk
          python -m pytest -q

      - name: Build distributions
        run: python -m build packages/python-sdk

      - name: Check distribution metadata
        run: python -m twine check packages/python-sdk/dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/python-sdk/dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
          print-hash: true
