name: Publish to MCP Registry

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 1.0.1). Required for manual catch-up runs; ignored when triggered by a tag push.'
        required: false
        default: ''

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          elif [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            echo "::error::workflow_dispatch requires the 'version' input"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing MCP registry entry for version $VERSION"

      - name: Sync server.json version to release version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          jq --arg v "$VERSION" '.version = $v | (.packages[].version) = $v' server.json > server.tmp
          mv server.tmp server.json
          echo "--- server.json after sync ---"
          jq '.name, .version, (.packages[].version)' server.json

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          ./mcp-publisher --version || true

      - name: Authenticate to MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Wait for package version on PyPI
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          package_url="https://pypi.org/pypi/agenda-intelligence-md/${VERSION}/json"
          for attempt in {1..10}; do
            if curl --fail --silent --show-error "$package_url" >/dev/null; then
              echo "agenda-intelligence-md ${VERSION} is visible on PyPI"
              exit 0
            fi
            if [ "$attempt" -lt 10 ]; then
              echo "PyPI version not visible yet (attempt ${attempt}/10); retrying in 15 seconds..."
              sleep 15
            fi
          done
          echo "::error::agenda-intelligence-md ${VERSION} was not visible on PyPI after 10 attempts"
          exit 1

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
