name: Publish to MCP Registry

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 1.0.1). Required for manual catch-up runs; ignored when triggered by a tag push.'
        required: false
        default: ''

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref }}

      - name: Determine version
        id: version
        env:
          RELEASE_INPUT: ${{ inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          elif [ -n "$RELEASE_INPUT" ]; then
            VERSION="$RELEASE_INPUT"
          else
            echo "::error::workflow_dispatch requires the 'version' input"
            exit 1
          fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid release version"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing MCP registry entry for version $VERSION"

      - name: Verify immutable release manifest
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          jq -e --arg v "$RELEASE_VERSION" '.version == $v and all(.packages[]; .version == $v)' server.json

      - name: Install pinned mcp-publisher
        env:
          PUBLISHER_VERSION: v1.8.1
          PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          set -euo pipefail
          curl -sSLf "https://github.com/modelcontextprotocol/registry/releases/download/${PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" -o "$RUNNER_TEMP/mcp-publisher.tar.gz"
          echo "${PUBLISHER_SHA256}  $RUNNER_TEMP/mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/mcp-publisher.tar.gz" mcp-publisher

      - name: Authenticate to MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Wait for package version on PyPI
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          package_url="https://pypi.org/pypi/agenda-intelligence-md/${VERSION}/json"
          for attempt in {1..10}; do
            if curl --fail --silent --show-error "$package_url" >/dev/null; then
              echo "agenda-intelligence-md ${VERSION} is visible on PyPI"
              exit 0
            fi
            if [ "$attempt" -lt 10 ]; then
              echo "PyPI version not visible yet (attempt ${attempt}/10); retrying in 15 seconds..."
              sleep 15
            fi
          done
          echo "::error::agenda-intelligence-md ${VERSION} was not visible on PyPI after 10 attempts"
          exit 1

      - name: Publish server to MCP Registry
        run: |
          set +e
          output=$(./mcp-publisher publish 2>&1)
          exit_code=$?
          echo "$output"
          if [ $exit_code -eq 0 ]; then
            echo "Successfully published to MCP Registry."
            exit 0
          elif echo "$output" | grep -qi "duplicate version"; then
            echo "Version ${{ steps.version.outputs.version }} is already published to MCP Registry. Skipping."
            exit 0
          else
            exit $exit_code
          fi

      - name: Verify published manifest and latest version
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python - <<'PYTHON'
          import json, os, time, urllib.request
          from pathlib import Path
          manifest = json.loads(Path('server.json').read_text())
          url = 'https://registry.modelcontextprotocol.io/v0.1/servers?search=io.github.vassiliylakhonin%2Fagenda-intelligence-md&limit=100'
          for attempt in range(12):
              with urllib.request.urlopen(url, timeout=30) as response:
                  entries = json.load(response)['servers']
              latest = [entry['server'] for entry in entries
                        if entry['server']['name'] == manifest['name']
                        and entry.get('_meta', {}).get('io.modelcontextprotocol.registry/official', {}).get('isLatest')]
              if len(latest) == 1 and latest[0]['version'] == os.environ['RELEASE_VERSION']:
                  for field in ('packages', 'remotes'):
                      assert latest[0].get(field) == manifest.get(field), field + ' drift'
                  print('Verified latest registry version, package and remote endpoints')
                  break
              if attempt == 11:
                  raise SystemExit('Registry latest version did not converge')
              time.sleep(5)
          PYTHON
