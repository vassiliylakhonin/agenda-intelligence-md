name: Live MCP client compatibility

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/check_live_mcp.py"
      - "scripts/verify_agent_card.mjs"
      - "tests/test_agent_card_monitor.mjs"
      - "scripts/urllib_mcp_client.py"
      - "tests/test_urllib_mcp_client.py"
      - "scripts/mcp-catalog-baseline.json"
      - "scripts/mcp-monitor-origins.json"
      - "tests/test_live_mcp_monitor.py"
      - ".github/workflows/live-mcp-monitor.yml"
  workflow_run:
    workflows: ["Deploy existing Worker fleet through Vizier", "Deploy Agent Output Verification"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: live-mcp-monitor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discovery:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Use the tested signature verifier runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Install MCP SDK
        run: python -m pip install 'mcp==1.30.0'
      - name: Select the catalog for the deployed runtime
        if: github.event_name == 'pull_request'
        env:
          DEPLOYED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$DEPLOYED_BASE_SHA"
          # A runtime-changing PR must compare production with its base.
          # A monitor-only repair must exercise its corrected catalog; the
          # unchanged runtime is already the deployed base. The offline runtime
          # inventory regression independently checks that corrected catalog.
          if ! git diff --quiet "$DEPLOYED_BASE_SHA" HEAD -- deploy/cloudflare-worker/src deploy/cloudflare-worker/wrangler.toml; then
            git show "$DEPLOYED_BASE_SHA:scripts/mcp-catalog-baseline.json" > "$RUNNER_TEMP/live-mcp-baseline.json"
            python - "$RUNNER_TEMP/live-mcp-baseline.json" <<'PYTHON'
          import json, pathlib, sys
          target = pathlib.Path('scripts/mcp-catalog-baseline.json')
          current = json.loads(target.read_text())
          baseline = json.loads(pathlib.Path(sys.argv[1]).read_text())
          # The standalone service has a separate repository/deploy lifecycle.
          baseline['corridor-bankability-analyst'] = current['corridor-bankability-analyst']
          target.write_text(json.dumps(baseline, indent=2) + '\n')
          PYTHON
          fi
      - name: Require SDK, default urllib, application client, health, dependencies and discovery contracts
        env:
          DEPLOYED_WORKFLOW: ${{ github.event.workflow_run.name }}
        run: |
          if [ "$DEPLOYED_WORKFLOW" = "Deploy Agent Output Verification" ]; then
            python scripts/check_live_mcp.py --require-default-urllib --worker agent-output-verification-a2a --output live-mcp-report.json
          else
            python scripts/check_live_mcp.py --require-default-urllib --output live-mcp-report.json
          fi
      - name: Save client compatibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-mcp-report
          path: live-mcp-report.json
          retention-days: 14
      - name: Surface default urllib regressions
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = Path("live-mcp-report.json")
          if not report.exists():
              raise SystemExit(1)
          for host in json.loads(report.read_text())["hosts"]:
              if not host["default_urllib"]["passed"]:
                  print(f"::error::{host['host']}: default urllib {host['default_urllib']['classification']}")
          PY
