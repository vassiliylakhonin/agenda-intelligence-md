name: Agent preflight smoke
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  real-mcp-client:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: ./actions/mcp-integration-check
        with:
          config: examples/mcp-integration-check/stdio.json
      - name: Check installed package outside the checkout
        working-directory: ${{ runner.temp }}
        run: agenda-mcp-check --self-test --strict --out installed-mcp-self-test.json
      - run: python -m pip install '.[dev,reviews,mcp-check]'
      - run: python -m pytest tests/test_action_gate.py tests/test_checkout_check.py tests/test_mcp_check.py tests/test_mcp_check_http.py tests/test_native_mcp_trial_client.py -q
      - run: python examples/agent-checkout-readiness/run.py --out checkout-sandbox-trace.json
      - run: agenda-checkout-check checkout-sandbox-trace.json --strict --out checkout-report.json
      - run: python -I scripts/smoke_preflight.py
