name: Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install flake8 black isort
      - name: Run flake8
        run: flake8 src/ tests/ scripts/ --max-line-length=120 --ignore=E203,W503
      - name: Run black (check)
        run: black --check --line-length=120 src/ tests/ scripts/
      - name: Run isort (check)
        run: isort --check-only --profile=black src/ tests/ scripts/
