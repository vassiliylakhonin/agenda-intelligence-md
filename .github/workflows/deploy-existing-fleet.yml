name: Deploy existing Worker fleet through Vizier

on:
  workflow_dispatch:
    inputs:
      target:
        description: Deploy all existing Workers or one selected Worker
        type: choice
        options:
          - all
          - agenda-root
          - interaction-trust
          - middle-corridor
          - cis-secondary
          - gulf-maritime
          - market-entry
        default: all
      initialize_card_signing:
        description: Initialize missing card keys for Financial Guard and Escrow only (never rotate)
        type: boolean
        default: false
      bootstrap_snapshot:
        description: One-time CIS asset migration from pinned verified main watchdog artifact (expires after 72h)
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: existing-worker-fleet-production
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.fleet.outputs.matrix }}
    defaults:
      run:
        working-directory: deploy/cloudflare-worker
    steps:
      - name: Checkout the immutable main commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
      - name: Use the tested Node.js runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Install pinned Worker test dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify the deployment source
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          npm test
      - name: Derive only already configured Worker targets
        id: fleet
        env:
          INITIALIZE_AGENT_CARD_SIGNING: ${{ inputs.initialize_card_signing }}
          DEPLOY_TARGET: ${{ inputs.target }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          import { deployedEnvironments } from './scripts/deploy-all.js';
          import { signingBootstrapEnvironments } from './scripts/card-signing-bootstrap.js';
          const all = deployedEnvironments(readFileSync('wrangler.toml', 'utf8'));
          let fleet = process.env.INITIALIZE_AGENT_CARD_SIGNING === 'true'
            ? all.filter(({env}) => signingBootstrapEnvironments.includes(env)) : all;
          const target = process.env.DEPLOY_TARGET || 'all';
          if (!['all', 'agenda-root', 'interaction-trust', 'middle-corridor', 'cis-secondary', 'gulf-maritime', 'market-entry'].includes(target)) throw new Error('Unknown deploy target');
          if (target === 'agenda-root') {
            if (process.env.INITIALIZE_AGENT_CARD_SIGNING === 'true') throw new Error('Signing bootstrap requires all target');
            fleet = all.filter(({env}) => env === '');
            if (fleet.length !== 1) throw new Error('Expected exactly one Agenda root Worker');
          }
          if (target === 'interaction-trust') {
            if (process.env.INITIALIZE_AGENT_CARD_SIGNING === 'true') throw new Error('Signing bootstrap requires all target');
            fleet = all.filter(({env, workerName}) => env === 'agentic-interaction-trust' && workerName === 'agentic-interaction-trust-a2a');
            if (fleet.length !== 1) throw new Error('Expected exactly one Interaction Trust Worker');
          }
          if (target === 'middle-corridor') {
            if (process.env.INITIALIZE_AGENT_CARD_SIGNING === 'true') throw new Error('Signing bootstrap requires all target');
            fleet = all.filter(({env, workerName}) => env === 'middle-corridor-deal-risk-gate' && workerName === 'middle-corridor-deal-risk-gate-a2a');
            if (fleet.length !== 1) throw new Error('Expected exactly one Middle Corridor Worker');
          }
          if (target === 'cis-secondary') {
            if (process.env.INITIALIZE_AGENT_CARD_SIGNING === 'true') throw new Error('Signing bootstrap requires all target');
            fleet = all.filter(({env, workerName}) => env === 'cis-secondary-sanctions' && workerName === 'cis-secondary-sanctions-a2a');
            if (fleet.length !== 1) throw new Error('Expected exactly one CIS Secondary Sanctions Worker');
          }
          if (target === 'gulf-maritime') {
            if (process.env.INITIALIZE_AGENT_CARD_SIGNING === 'true') throw new Error('Signing bootstrap requires all target');
            fleet = all.filter(({env, workerName}) => env === 'gulf-maritime-exposure' && workerName === 'gulf-maritime-exposure-a2a');
            if (fleet.length !== 1) throw new Error('Expected exactly one Gulf Maritime Worker');
          }
          if (target === 'market-entry') {
            if (process.env.INITIALIZE_AGENT_CARD_SIGNING === 'true') throw new Error('Signing bootstrap requires all target');
            fleet = all.filter(({env, workerName}) => env === 'kazakhstan-market-entry-readiness' && workerName === 'kazakhstan-market-entry-readiness-a2a');
            if (fleet.length !== 1) throw new Error('Expected exactly one Market Entry Worker');
          }
          if (process.env.INITIALIZE_AGENT_CARD_SIGNING === 'true' && fleet.length !== 2) {
            throw new Error('Signing bootstrap requires exactly the two existing targets');
          }
          if (!fleet.length || fleet.some(({env, workerName}) =>
            !/^[a-z0-9-]*$/.test(env) || !/^[a-z0-9-]+$/.test(workerName))) {
            throw new Error('Invalid configured Worker fleet');
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify({include:fleet})}\n`);
          JS

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.verify.outputs.matrix) }}
    # Reuse the existing protected owner-controlled credential boundary.
    environment:
      name: agent-output-verification-production
    defaults:
      run:
        working-directory: deploy/cloudflare-worker
    env:
      WORKER_ENV: ${{ matrix.env }}
    steps:
      - name: Checkout the same tested commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
      - name: Use the tested Node.js runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Verify clean immutable source again
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
      - uses: actions/setup-python@v6
        if: matrix.env == 'cis-secondary-sanctions'
        with:
          python-version: '3.12'
      - name: Restore only the verified compact CIS snapshot asset
        if: matrix.env == 'cis-secondary-sanctions'
        working-directory: .
        env:
          BOOTSTRAP_SNAPSHOT: ${{ inputs.bootstrap_snapshot }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$BOOTSTRAP_SNAPSHOT" = 'true' ]; then
            gh run download 39755543609 --name sanctions-name-index-39755543609 --dir "$RUNNER_TEMP/snapshot-bootstrap"
            python scripts/snapshot_worker_assets.py --bootstrap-artifact "$RUNNER_TEMP/snapshot-bootstrap"
          else
            python scripts/snapshot_worker_assets.py
          fi
      - name: Mint a separate short-lived grant for this Worker
        env:
          VIZIER_DELEGATION_SIGNING_KEY: ${{ secrets.VIZIER_DELEGATION_SIGNING_KEY }}
        run: |
          if [ -n "$WORKER_ENV" ]; then
            node scripts/mint-deploy-grant.js --out "$RUNNER_TEMP/vizier-deploy-grant.jws" --env "$WORKER_ENV"
          else
            node scripts/mint-deploy-grant.js --out "$RUNNER_TEMP/vizier-deploy-grant.jws" --top-level
          fi
      - name: Require matching Vizier ALLOW before this deployment
        env:
          INITIALIZE_AGENT_CARD_SIGNING: ${{ inputs.initialize_card_signing }}
          VIZIER_API_KEY: ${{ secrets.VIZIER_API_KEY }}
          VIZIER_DEPLOY_GRANT_FILE: ${{ runner.temp }}/vizier-deploy-grant.jws
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$WORKER_ENV" ]; then
            node scripts/vizier-gated-deploy.js --env "$WORKER_ENV"
          else
            node scripts/vizier-gated-deploy.js --top-level
          fi
      - name: Remove delegation token
        if: always()
        run: rm -f "$RUNNER_TEMP/vizier-deploy-grant.jws"
