name: Publish ElizaOS Plugin to NPM

on:
  workflow_dispatch:

jobs:
  build-and-publish:
    name: Build and Publish to NPM
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies and build plugin
        working-directory: integrations/elizaos
        run: |
          npm ci
          npm test

      - name: Verify package bundle
        working-directory: integrations/elizaos
        run: |
          npm pack --dry-run

      - name: Publish to NPM
        working-directory: integrations/elizaos
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm publish --access public
