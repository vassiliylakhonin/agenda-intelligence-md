name: Bug report
description: Report a bug to help us improve
labels: bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: input
    id: description
    attributes:
      label: Brief description
      placeholder: Summarize the bug in one sentence
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `agenda-intelligence ...`
        2. Observe error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What should happen instead?
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: What actually happened?
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "e.g., 0.5.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Linux
        - macOS
        - Windows
        - Other
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I have searched existing issues to avoid duplicates.
          required: true
