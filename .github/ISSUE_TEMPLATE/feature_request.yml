name: Feature request
description: Suggest a new feature or improvement
labels: enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the project!
  - type: input
    id: title
    attributes:
      label: Short title
      placeholder: One‑line summary of the feature
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Detailed description
      placeholder: |
        Explain the problem you want to solve and why the feature would help.
    validations:
      required: true
  - type: textarea
    id: implementation
    attributes:
      label: Possible implementation ideas (optional)
      placeholder: |
        Any thoughts on how it could be implemented?
  - type: input
    id: version
    attributes:
      label: Target version (optional)
      placeholder: "e.g., 0.6.0"
