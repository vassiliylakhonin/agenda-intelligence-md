name = "agenda-intelligence-a2a"
main = "src/index.js"
compatibility_date = "2026-05-22"
workers_dev = true

[observability]
enabled = true

[[kv_namespaces]]
binding = "AGENDA_USAGE"
id = "d2228183999246ccbec8aa2d5f130bfc"

# Optional production access gate. When the MIDDLE_CORRIDOR_API_KEY secret is
# set, the message/send production route requires `Authorization: Bearer <key>`
# (401 + WWW-Authenticate: Bearer otherwise) and the agent card advertises the
# `productionBearer` security requirement. While unset, the route stays an open
# free demo and the card advertises no requirement (current state). To gate it:
#   wrangler secret put MIDDLE_CORRIDOR_API_KEY --env middle-corridor-deal-risk-gate
# agent/card discovery stays public regardless.
[env.middle-corridor-deal-risk-gate]
name = "middle-corridor-deal-risk-gate-a2a"
workers_dev = true

[env.middle-corridor-deal-risk-gate.vars]
AGENT_PROFILE = "kazakhstan"

[[env.middle-corridor-deal-risk-gate.kv_namespaces]]
binding = "AGENDA_USAGE"
id = "d2228183999246ccbec8aa2d5f130bfc"

# CIS Secondary-Sanctions Exposure — per ADR 0014, this profile opts in to
# live retrieval against the OpenSanctions consolidated dataset (CC-BY 4.0).
# Before deploying with `wrangler deploy --env cis-secondary-sanctions`:
#   wrangler secret put OPENSANCTIONS_API_KEY --env cis-secondary-sanctions
# (free key at https://www.opensanctions.org/api/).
# Without the secret the profile responds gracefully with
# live_retrieval_status: disabled and triage based on user-supplied
# evidence only.
[env.cis-secondary-sanctions]
name = "cis-secondary-sanctions-a2a"
workers_dev = true

[env.cis-secondary-sanctions.vars]
AGENT_PROFILE = "cis_secondary_sanctions"

[[env.cis-secondary-sanctions.kv_namespaces]]
binding = "AGENDA_USAGE"
id = "d2228183999246ccbec8aa2d5f130bfc"

[env.agentic-interaction-trust]
name = "agentic-interaction-trust-a2a"
workers_dev = true

[env.agentic-interaction-trust.vars]
AGENT_PROFILE = "agentic_interaction_trust"

[[env.agentic-interaction-trust.kv_namespaces]]
binding = "AGENDA_USAGE"
id = "d2228183999246ccbec8aa2d5f130bfc"
