name = "agenda-intelligence-a2a"
main = "src/index.js"
compatibility_date = "2026-05-22"
workers_dev = true

[observability]
enabled = true

[[kv_namespaces]]
binding = "AGENDA_USAGE"
id = "d2228183999246ccbec8aa2d5f130bfc"

# Optional production access gate. When the MIDDLE_CORRIDOR_API_KEY secret is
# set, the message/send production route requires `Authorization: Bearer <key>`
# (401 + WWW-Authenticate: Bearer otherwise) and the agent card advertises the
# `productionBearer` security requirement. While unset, the route stays an open
# free demo and the card advertises no requirement (current state). To gate it:
#   wrangler secret put MIDDLE_CORRIDOR_API_KEY --env middle-corridor-deal-risk-gate
# agent/card discovery stays public regardless.
[env.middle-corridor-deal-risk-gate]
name = "middle-corridor-deal-risk-gate-a2a"
workers_dev = true

[env.middle-corridor-deal-risk-gate.vars]
AGENT_PROFILE = "kazakhstan"

[[env.middle-corridor-deal-risk-gate.kv_namespaces]]
binding = "AGENDA_USAGE"
id = "d2228183999246ccbec8aa2d5f130bfc"

# CIS Secondary-Sanctions Exposure — per ADR 0014, this profile declares
# optional live sanctions-list retrieval. Watchman self-host is preferred
# (Apache-2.0, no per-call fee); OpenSanctions hosted API remains a paid
# fallback (CC-BY-4.0). Before deploying with activation:
#   wrangler secret put WATCHMAN_URL --env cis-secondary-sanctions
# or:
#   wrangler secret put OPENSANCTIONS_API_KEY --env cis-secondary-sanctions
# Without either secret, the profile responds gracefully with
# live_retrieval_status: disabled and triage based on user-supplied evidence.
[env.cis-secondary-sanctions]
name = "cis-secondary-sanctions-a2a"
workers_dev = true

[env.cis-secondary-sanctions.vars]

AGENT_PROFILE = "cis_secondary_sanctions"
# Snapshot upstream (ADR 0014): $0 server-side name screening against a compact
# public-list index served over HTTP. Not a secret (public URL), so it belongs in
# [vars] rather than a secret. No index is published yet, so the var is unset and
# the adapter reports live_retrieval_status "disabled" — it never reports an
# unscreened name as clean. To activate, publish the index and set:
#   SNAPSHOT_INDEX_URL = "https://<host>/sanctions-name-index-compact.json"
# Set SNAPSHOT_DISABLED=1 to deactivate without removing the URL.

# Optional access controls for the message/send route — both OFF by default so
# the browser demo stays an open free evaluation. Flip on when needed:
#   Hard paywall (closes the route, incl. the demo) — issue a key per customer:
#     wrangler secret put CIS_SECONDARY_SANCTIONS_API_KEY --env cis-secondary-sanctions
#   Soft per-IP/hour throttle (keeps the demo usable, caps bulk free use) —
#     uncomment the line below (best-effort, KV-backed, fails open):
# RATE_LIMIT_PER_HOUR = "60"

[[env.cis-secondary-sanctions.kv_namespaces]]
binding = "AGENDA_USAGE"
id = "d2228183999246ccbec8aa2d5f130bfc"

[env.agentic-interaction-trust]
