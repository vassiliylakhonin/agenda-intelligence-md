name: RAG citation review

# This manual trigger splits a bundled synthetic input to demonstrate the
# handoff. For real data, capture the snapshot and digest in the retrieval job.
on: workflow_dispatch

permissions:
  contents: read

jobs:
  citations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install checker
        run: python -m pip install "agenda-intelligence-md==1.26.0"
      - name: Prepare synthetic retrieval and answer artifacts
        id: capture
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          fixture = Path("examples/output-verification/rag-answer.json")
          packet = json.loads(fixture.read_text(encoding="utf-8"))
          sources = json.dumps(packet["sources"]).encode("utf-8")
          (temp / "sources.json").write_bytes(sources)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"sha256={hashlib.sha256(sources).hexdigest()}", file=output)
          (temp / "answer.json").write_text(json.dumps({"answer": packet["answer"]}), encoding="utf-8")
          PY
      - name: Check citations
        env:
          SOURCES_SHA256: ${{ steps.capture.outputs.sha256 }}
        run: |
          python examples/output-verification/ci-review.py "$RUNNER_TEMP/answer.json" \
            --sources "$RUNNER_TEMP/sources.json" \
            --sources-sha256 "$SOURCES_SHA256" > "$RUNNER_TEMP/citations.json"
          if jq -e '.route == "revise"' "$RUNNER_TEMP/citations.json" >/dev/null; then
            echo "::warning::Citation findings require human review."
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: citation-findings
          path: ${{ runner.temp }}/citations.json
          retention-days: 7
          if-no-files-found: error
