name: 'Agenda Intelligence Evidence Linter'
description: 'Deterministic evidence-packet and document review linter for claim-backed AI output.'
author: 'Vassiliy Lakhonin'
branding:
  icon: 'check-circle'
  color: 'blue'

inputs:
  path:
    description: 'Path to evidence packet JSON file or evidence review manifest JSON file'
    required: true
  command:
    description: 'Command to run: "check" (evidence packet) or "review" (local document review manifest)'
    required: false
    default: 'check'
  strict:
    description: 'Exit non-zero if packet is not complete'
    required: false
    default: 'true'
  format:
    description: 'Output format (text/json/sarif for check, markdown/json/html for review)'
    required: false
    default: 'text'
  python-version:
    description: 'Python version to use'
    required: false
    default: '3.11'
  pr-comment:
    description: 'Opt-in sticky result summary on same-repository pull_request events (check only)'
    required: false
    default: 'false'
  github-token:
    description: 'Token with pull-requests: write, used only when pr-comment is true'
    required: false
    default: ${{ github.token }}

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install agenda-intelligence-md
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        python -m pip install --upgrade pip
        pip install "$ACTION_PATH"

    - name: Run evidence check/review
      id: evidence_lint
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_STRICT: ${{ inputs.strict }}
        INPUT_COMMAND: ${{ inputs.command }}
        INPUT_FORMAT: ${{ inputs.format }}
        PR_COMMENT: ${{ inputs.pr-comment }}
      run: |
        STRICT_FLAGS=()
        if [ "$INPUT_STRICT" = "true" ]; then STRICT_FLAGS=(--strict); fi
        case "$INPUT_COMMAND:$INPUT_FORMAT" in
          check:text|check:json|check:sarif|review:markdown|review:json|review:html) ;;
          *) echo 'Unsupported command/format combination'; exit 2 ;;
        esac
        set +e
        if [ "$INPUT_COMMAND:$INPUT_FORMAT" = 'check:sarif' ]; then
          agenda-intelligence check "$INPUT_PATH" --format sarif \
            --out "${RUNNER_TEMP}/agenda-intelligence.sarif" "${STRICT_FLAGS[@]}"
        else
          agenda-intelligence "$INPUT_COMMAND" "$INPUT_PATH" --format "$INPUT_FORMAT" "${STRICT_FLAGS[@]}"
        fi
        CHECK_EXIT=$?
        if [ "$PR_COMMENT" = 'true' ] && [ "$INPUT_COMMAND" = 'check' ]; then
          agenda-intelligence check "$INPUT_PATH" --format json > "${RUNNER_TEMP}/agenda-evidence-result.json"
          JSON_EXIT=$?
          if [ "$JSON_EXIT" -ne 0 ] && [ "$CHECK_EXIT" -eq 0 ]; then CHECK_EXIT=$JSON_EXIT; fi
        fi
        echo "exit_code=${CHECK_EXIT}" >> "$GITHUB_OUTPUT"
        exit 0

    - name: Comment evidence summary on PR
      if: ${{ always() && inputs.pr-comment == 'true' && inputs.command == 'check' && steps.evidence_lint.outputs.exit_code != '' }}
      uses: actions/github-script@v7
      env:
        AGENDA_ACTION_PATH: ${{ github.action_path }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const path = require('node:path');
          const { publishComment } = require(path.join(process.env.AGENDA_ACTION_PATH, 'scripts/evidence_pr_comment.cjs'));
          await publishComment({ github, context, core, reportPath: path.join(process.env.RUNNER_TEMP, 'agenda-evidence-result.json') });

    - name: Upload SARIF
      if: ${{ inputs.command == 'check' && inputs.format == 'sarif' && always() }}
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ runner.temp }}/agenda-intelligence.sarif

    - name: Enforce evidence result
      if: ${{ always() && steps.evidence_lint.outputs.exit_code != '' && steps.evidence_lint.outputs.exit_code != '0' }}
      shell: bash
      run: exit 1
