[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agenda-intelligence-md"
version = "0.4.1"
description = "A drop-in markdown cognition layer for AI agents that need to analyze public agenda"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Vassiliy Lakhonin"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/vassiliylakhonin/agenda-intelligence-md"
Repository = "https://github.com/vassiliylakhonin/agenda-intelligence-md.git"
Documentation = "https://github.com/vassiliylakhonin/agenda-intelligence-md/tree/main/docs"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]

dependencies = [
    "jsonschema>=4.20",
    "referencing>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]

[project.scripts]
agenda-intelligence = "agenda_intelligence.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
