[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agenda-intelligence-md"
version = "0.5.3"
description = "A drop-in markdown cognition layer for AI agents that need to analyze public agenda"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    {name = "Vassiliy Lakhonin"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

license-files = ["LICENSE"]

dependencies = [
    "jsonschema>=4.20",
    "referencing>=0.30",
]

[project.urls]
Homepage = "https://github.com/vassiliylakhonin/agenda-intelligence-md"
Repository = "https://github.com/vassiliylakhonin/agenda-intelligence-md.git"
Documentation = "https://github.com/vassiliylakhonin/agenda-intelligence-md/tree/main/docs"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "mypy>=1.0",
    "ruff>=0.1",
]

[project.scripts]
agenda-intelligence = "agenda_intelligence.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 120
target-version = ["py311"]
