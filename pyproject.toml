[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agenda-intelligence-md"
version = "1.1.1"
description = "CLI, MCP server, and JSON schemas for evidence-readiness checks on AI/vendor/procurement source packs"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    {name = "Vassiliy Lakhonin"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

license-files = ["LICENSE"]

dependencies = [
    "jsonschema>=4.20",
    "referencing>=0.30",
]

[project.urls]
Homepage = "https://github.com/vassiliylakhonin/agenda-intelligence-md"
Repository = "https://github.com/vassiliylakhonin/agenda-intelligence-md.git"
Documentation = "https://github.com/vassiliylakhonin/agenda-intelligence-md/tree/main/docs"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "mypy>=1.0",
    "ruff>=0.1",
]
llm = [
    "anthropic>=0.40",
]
pdf = [
    "fpdf2>=2.7",
]

[project.scripts]
agenda-intelligence = "agenda_intelligence.cli:main"
agenda-intelligence-mcp = "agenda_intelligence.mcp_stdio:main"
agenda-intelligence-http = "agenda_intelligence.http_api:main"
agenda-intelligence-a2a = "agenda_intelligence.a2a_adapter:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 120
target-version = ["py311"]
